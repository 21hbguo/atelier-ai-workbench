services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-app_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set in .env}
      POSTGRES_DB: ${PG_DB:-app_db}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-app_user}"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8082}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://127.0.0.1:${SEARXNG_PORT:-8082}}


  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-5173}:80"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${PG_USER:-app_user}:${PG_PASSWORD:?PG_PASSWORD must be set in .env}@db:5432/${PG_DB:-app_db}
      TZ: Asia/Shanghai
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1,::1,private}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
      # 联网搜索：容器内通过服务名访问 searxng；本地（非 docker）跑后端改为 http://127.0.0.1:8081
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
